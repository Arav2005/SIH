<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h2>Farm Risk Assessment Dashboard</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Farmer</th>
            <th>Farm Type</th>
            <th>Location</th>
            <th>Animals</th>
            <th>Score</th>
            <th>Risk Level</th>
            <th>Recommendations</th>
        </tr>
        {% for row in records %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
            <td>{{ row[6] }}</td>
            <td>{{ row[7] }}</td>
        </tr>
        {% endfor %}
    </table>
    <br><a href="/">Back to Home</a>
</body>
</html>
